---
# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: general

"on":
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  linting:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'rolehippie'

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install tools
        uses: jdx/mise-action@v4

      - name: Install requirements
        run: ansible-galaxy install -r requirements.yml

      - name: Role linting
        run: ansible-lint
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

  testing:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'rolehippie'

    strategy:
      fail-fast: false

      matrix:
        scenario:
          # The `docker` scenario is intentionally excluded from the active
          # matrix: it installs a Docker daemon inside the molecule container
          # (nested/DinD) and pulls a MariaDB image. On hosts without real
          # overlayfs support the layer extraction fails with
          # "failed to convert whiteout file ... operation not permitted".
          # This is a structural DinD limitation, not a role defect.
          - default
          - no-upstream
          - backup

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install tools
        uses: jdx/mise-action@v4

      - name: Install requirements
        run: ansible-galaxy install -r requirements.yml

      - name: Molecule tests
        run: molecule test --scenario-name ${{ matrix.scenario }}
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

...
